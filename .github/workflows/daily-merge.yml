name: 每日合并节点订阅

on:
  schedule:
    # 每 30 分钟检查一次：资源分享师文件一进仓库，最晚 30 分钟内合并提交
    # （GitHub 定时任务本身可能晚几分钟到几十分钟，仍远快于原来一天一次）
    - cron: "*/30 * * * *"
  workflow_dispatch:  # 允许在网页上手动点 Run，立刻合并一次
  push:
    paths:
      - "merge.py"
      - ".github/workflows/daily-merge.yml"
      # 注意：nodes.txt / merged-raw.txt 的提交不会触发，避免循环

permissions:
  contents: write

# 串行化运行：上一次没跑完时，下一次排队等，不并发推送
concurrency:
  group: daily-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 合并订阅
        env:
          # Actions 内置 token：merge.py 用它调 GitHub API，避免高频轮询撞上
          # 未认证 60 次/小时限流；无此变量时退回未认证调用
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python merge.py
          # nodes.txt 保持明文（一行一个），与仓库现有格式一致，Karing 直接识别
          cp merged-raw.txt nodes.txt

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 先拉取再提交，避免多人/多任务并发推送被拒（2026-10-19 的老问题）
          git pull --rebase
          git add nodes.txt merged-raw.txt
          git diff --cached --quiet || git commit -m "自动合并节点 $(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M)"
          git push
